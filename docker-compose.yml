services:
  tanda-db:
    image: postgres:15-alpine
    container_name: tanda-db
    environment:
      POSTGRES_PASSWORD: tanda_dev_pass
      POSTGRES_USER: tanda
      POSTGRES_DB: tanda
    ports:
      - "54322:5432"
    volumes:
      - tanda-pg:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanda -d tanda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tanda-pg:
